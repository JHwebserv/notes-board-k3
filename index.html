<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>반포 전월세</title><style>:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1c1914;--muted:#6b645b;--line:#e6dfd3;--down:#157a4b;--up:#b42318;--pad:max(16px,env(safe-area-inset-left))}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:16px var(--pad) 56px}
h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{color:var(--muted);font-size:11px}.stat b{display:block;margin-top:4px;font-size:20px}
.tabs{display:flex;gap:8px;margin:0 0 10px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 8px;font-size:14px}
.tabs button.on{background:#1c1914;color:#fff;border-color:#1c1914}
.sticky{position:sticky;top:0;z-index:5;background:rgba(243,239,230,.96);backdrop-filter:blur(10px);padding:8px 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controls input#q{grid-column:1/-1}
.check{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.check input{width:18px;height:18px;margin:0}
input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px}
.count{margin:8px 0 0;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.card.open{border-color:#1c1914}
.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.now{font-size:20px;font-weight:800}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
.jeonse{background:#eef2ff;color:#3730a3}.monthly{background:#fff6e8;color:#b54708}
.owner{background:#ecfdf3;color:#067647}.cx{background:#f4f4f5;color:#3f3f46}
.meta{font-size:13px;margin-top:6px}.id{color:var(--muted);font-size:11px;margin-top:6px}
.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card.open .detail{display:block}
.btn{display:block;width:100%;margin-top:10px;background:#1c1914;color:#fff;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700}
.banner{border-radius:10px;padding:10px 12px;margin:0 0 8px;font-weight:800}
.down{background:#e7f6ee;color:var(--down)}.up{background:#fdecea;color:var(--up)}
.was{text-decoration:line-through;opacity:.7;font-size:13px}
.empty{color:var(--muted);line-height:1.5}
.hint{color:var(--muted);font-size:12px;margin-top:6px}</style></head><body>
<div class="wrap">
<h1>반포 전월세</h1>
<p class="sub">트리니원·아크로리버파크 전월세입니다. 매물을 누르면 그래프가 열립니다.</p>
<div class="empty" id="err"></div>
<div class="grid"><div class="stat"><span>전체</span><b id="nAll">...</b></div><div class="stat"><span>30 / 40</span><b id="n3040">...</b></div></div>
<div class="tabs"><button id="tChange">변동만</button><button class="on" id="tAll">전체</button></div>
<div class="sticky"><div class="controls">
<input id="q" placeholder="단지, 동, 가격, ID 검색"/>
<select id="cx"><option value="">전체 단지</option><option value="triniwon">트리니원</option><option value="acro">아크로리버파크</option></select>
<select id="cat"><option value="">전체 평형</option><option value="30">30평대</option><option value="40">40평대</option></select>
<select id="trade"><option value="">전체 거래</option><option value="전세">전세</option><option value="월세">월세</option></select>
<label class="check"><input id="ownerOnly" type="checkbox"/> 집주인 인증만</label>
</div><p class="count" id="count"></p></div>
<div id="list"></div>
</div>
<script>
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function eok(m){if(m==null||!isFinite(m))return ''; const e=m/10000; const t=Number.isInteger(e)?String(e):e.toFixed(2).replace(/0+$/,'').replace(/\.$/,''); return t+'억';}
function fmtDiff(m){if(!m)return '변동 없음'; return (m<0?'':'+')+eok(m);}
function changeOf(x){ const hist=x.hist||[]; if(hist.length<2) return {kind:'none'}; const first=hist[0], last=hist[hist.length-1]; const diff=(last.m||0)-(first.m||0); return {kind:diff<0?'down':diff>0?'up':'flat',first,last,diff}; }
function spark(hist){
  const w=600,h=120,p=22; const pts=(hist||[]).filter(v=>v.m>0&&v.m<9e8);
  if(!pts.length) return '<div class="empty">이 매물 가격 기록이 없습니다.</div>';
  const vals=pts.map(v=>v.m); const min=Math.min(...vals)*0.97, max=Math.max(...vals)*1.03;
  const x=i=>p+(pts.length===1?(w-2*p)/2:i*(w-2*p)/Math.max(1,pts.length-1));
  const y=v=>h-p-((v-min)/(max-min||1))*(h-2*p);
  const d=pts.map((s,i)=>(i?'L':'M')+x(i)+','+y(s.m)).join(' ');
  const dots=pts.map((s,i)=>'<circle cx="'+x(i)+'" cy="'+y(s.m)+'" r="4" fill="#1c1914"/><text x="'+x(i)+'" y="'+(h-6)+'" text-anchor="middle" font-size="10" fill="#6b645b">'+esc(s.d.slice(5))+'</text>').join('');
  const first=pts[0], last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="120"><path d="'+d+'" fill="none" stroke="#1c1914" stroke-width="2.5"/>'+dots+'</svg><div class="hint">'+esc(first.d)+' '+esc(first.p)+' → '+esc(last.d)+' '+esc(last.p)+' ('+fmtDiff((last.m||0)-(first.m||0))+')</div>';
}
function card(x,open){
  const c=changeOf(x);
  let head='<div class="now">'+esc(x.price)+'</div><div class="id">환산 '+esc(x.eqLow)+'</div>';
  if(c.kind==='down') head='<div class="banner down">이 매물 내림<br><div class="was">'+esc(c.first.p)+'</div><div class="now">'+esc(x.price)+'</div><div>'+fmtDiff(c.diff)+'</div></div>';
  if(c.kind==='up') head='<div class="banner up">이 매물 오름<br><div class="was">'+esc(c.first.p)+'</div><div class="now">'+esc(x.price)+'</div><div>'+fmtDiff(c.diff)+'</div></div>';
  const btn=x.articleNo?'네이버에서 이 매물 보기':'네이버 단지 목록 보기';
  const tags='<div class="tags"><span class="tag cx">'+esc(x.complexName||'')+'</span><span class="tag '+(x.trade==='전세'?'jeonse':'monthly')+'">'+esc(x.trade)+'</span>'+(x.owner?'<span class="tag owner">집주인인증</span>':'')+'</div>';
  return '<article class="card'+(open?' open':'')+'" data-id="'+esc(x.id)+'"><div class="head"><div>'+head+'</div>'+tags+'</div><div class="meta">'+esc(x.cat)+'평대 '+esc(x.supply)+'/'+esc(x.exclusive)+'㎡ · '+esc(x.dong)+'동 · '+esc(x.floor)+' · '+esc(x.dir)+'</div><div class="id">'+esc(x.id)+' · 눌러서 이 매물 그래프</div><div class="detail"><div class="meta">이 매물 가격 추이</div>'+spark(x.hist)+'<a class="btn" href="'+esc(x.link)+'" target="_blank" rel="noopener">'+btn+'</a></div></article>';
}
let DATA=[], tab='all', openId=null;
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const cx=document.getElementById('cx').value; const cat=document.getElementById('cat').value; const trade=document.getElementById('trade').value;
  const ownerOnly=document.getElementById('ownerOnly').checked;
  const filtered=DATA.filter(x=>{ const c=changeOf(x); if(tab==='change' && c.kind!=='down' && c.kind!=='up') return false; if(cx&&x.complex!==cx) return false; if(cat&&x.cat!==cat) return false; if(trade&&x.trade!==trade) return false; if(ownerOnly && !x.owner) return false; if(!q) return true; return [x.complexName,x.id,x.price,x.dong,x.floor,x.supply].join(' ').toLowerCase().includes(q); });
  document.getElementById('count').textContent='보이는 매물 '+filtered.length.toLocaleString()+'건';
  document.getElementById('list').innerHTML=filtered.length?filtered.map(x=>card(x,x.id===openId)).join(''):'<div class="empty">해당하는 매물이 없습니다.</div>';
  document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('a')) return; openId=openId===el.dataset.id?null:el.dataset.id; render(); }));
}
(async()=>{
  try{
    const pack=await (await fetch('data.json?t='+Date.now())).json();
    DATA=pack.rows||pack;
    document.getElementById('nAll').textContent=DATA.length.toLocaleString();
    document.getElementById('n3040').textContent=DATA.filter(x=>x.cat==='30').length+' / '+DATA.filter(x=>x.cat==='40').length;
    document.getElementById('tChange').onclick=()=>{tab='change';document.getElementById('tChange').className='on';document.getElementById('tAll').className='';render();};
    document.getElementById('tAll').onclick=()=>{tab='all';document.getElementById('tAll').className='on';document.getElementById('tChange').className='';render();};
    ['q','cx','cat','trade'].forEach(id=>document.getElementById(id).addEventListener('input',render));
    document.getElementById('ownerOnly').addEventListener('change',render);
    render();
  }catch(e){document.getElementById('err').textContent='데이터를 불러오지 못했습니다.';}
})();
</script></body></html>
