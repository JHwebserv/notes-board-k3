<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f4f1ea"/>
<title>보드</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1c1914;--muted:#6b645b;--line:#e6dfd3;--pad:max(16px,env(safe-area-inset-left))}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.gate{max-width:420px;margin:16vh 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.wrap{display:none;max-width:1280px;margin:0 auto;padding:16px var(--pad) 88px}
input,select,button{font:inherit;border-radius:12px;padding:14px 12px;border:1px solid var(--line);width:100%;font-size:16px}
button{background:#1c1914;color:#fff;border:0}
.err{color:#b42318;min-height:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;margin-top:4px}
.sticky{position:sticky;top:0;z-index:5;background:rgba(244,241,234,.94);backdrop-filter:blur(10px);padding:8px 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controls input{grid-column:1/-1}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.top{display:flex;justify-content:space-between;gap:8px}
.price{font-size:18px;font-weight:800}
.eq,.id,.sub,.count{color:var(--muted);font-size:12px}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
.jeonse{background:#eef2ff;color:#3730a3}.monthly{background:#fff6e8;color:#b54708}
.desk{display:none}
@media(min-width:900px){
  .cards{display:none}
  .desk{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:72vh}
  .controls{display:flex}
  input,select{width:auto}
}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 6px;border-top:1px solid var(--line);text-align:left}
th{position:sticky;top:0;background:#f8f4ec}
</style></head><body>
<div class="gate" id="gate">
<h2>보드</h2>
<p class="sub">비밀번호를 입력하세요.</p>
<input id="pw" type="password" placeholder="비밀번호"/>
<button id="go" style="margin-top:10px">열기</button>
<p class="err" id="err"></p>
</div>
<div class="wrap" id="app">
<h1>전월세 보드</h1>
<p class="sub" id="asof"></p>
<div class="grid">
<div class="stat"><span class="sub">전체</span><b id="nAll"></b></div>
<div class="stat"><span class="sub">30평대</span><b id="n30"></b></div>
<div class="stat"><span class="sub">40평대</span><b id="n40"></b></div>
<div class="stat"><span class="sub">전세 / 월세</span><b id="nTrade"></b></div>
</div>
<div class="sticky">
<div class="controls">
<input id="q" placeholder="동, 가격, ID 검색"/>
<select id="cat"><option value="">전체 평형</option><option value="30">30평대</option><option value="40">40평대</option></select>
<select id="trade"><option value="">전체 거래</option><option value="전세">전세</option><option value="월세">월세</option></select>
</div>
<p class="count" id="count"></p>
</div>
<div class="cards" id="cards"></div>
<div class="desk"><table><thead><tr><th>순위</th><th>ID</th><th>집</th><th>거래</th><th>가격</th><th>환산하한</th><th>전세환산</th><th>면적</th><th>동</th><th>층</th><th>방향</th><th>중개</th><th>확인</th></tr></thead><tbody id="body"></tbody></table></div>
</div>
<script>
async function unlock(pw, buf){
  const bin=new Uint8Array(buf);
  const salt=bin.slice(0,16), iv=bin.slice(16,28), tag=bin.slice(28,44), data=bin.slice(44);
  const enc=new Uint8Array(data.length+tag.length); enc.set(data); enc.set(tag, data.length);
  const keyMat=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'}, keyMat, {name:'AES-GCM',length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, enc);
  return JSON.parse(new TextDecoder().decode(pt));
}
let DATA=[];
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const cat=document.getElementById('cat').value;
  const trade=document.getElementById('trade').value;
  const filtered=DATA.filter(x=>{
    if(cat && x.cat!==cat) return false;
    if(trade && x.trade!==trade) return false;
    if(!q) return true;
    return [x.id,x.house,x.trade,x.price,x.eq,x.eqLow,x.supply,x.dong,x.floor,x.dir].join(' ').toLowerCase().includes(q);
  });
  document.getElementById('count').textContent='보이는 매물 '+filtered.length.toLocaleString()+'건 / 전체 '+DATA.length.toLocaleString()+'건';
  document.getElementById('cards').innerHTML=filtered.map(x=>'<article class="card"><div class="top"><div><div class="price">'+x.price+'</div><div class="eq">환산 '+x.eqLow+'</div></div><span class="tag '+(x.trade==='전세'?'jeonse':'monthly')+'">'+x.trade+'</span></div><div>'+x.cat+'평대 '+x.supply+'/'+x.exclusive+'㎡ · '+x.dong+'동 · '+x.floor+' · '+x.dir+'</div><div class="id">#'+x.rank+' · '+x.id+' · 중개 '+x.agency+' · '+x.date+'</div></article>').join('');
  document.getElementById('body').innerHTML=filtered.map(x=>'<tr><td>'+x.rank+'</td><td>'+x.id+'</td><td>'+x.house+'</td><td>'+x.trade+'</td><td>'+x.price+'</td><td>'+x.eqLow+'</td><td>'+x.eq+'</td><td>'+x.supply+'/'+x.exclusive+'㎡</td><td>'+x.dong+'동</td><td>'+x.floor+'</td><td>'+x.dir+'</td><td>'+x.agency+'</td><td>'+x.date+'</td></tr>').join('');
}
document.getElementById('go').onclick=async()=>{
  document.getElementById('err').textContent='';
  try{
    const res=await fetch('data.bin?t='+Date.now());
    if(!res.ok) throw new Error('data');
    const buf=await res.arrayBuffer();
    DATA=await unlock(document.getElementById('pw').value, buf);
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('nAll').textContent=DATA.length.toLocaleString();
    document.getElementById('n30').textContent=DATA.filter(x=>x.cat==='30').length;
    document.getElementById('n40').textContent=DATA.filter(x=>x.cat==='40').length;
    document.getElementById('nTrade').textContent=DATA.filter(x=>x.trade==='전세').length+' / '+DATA.filter(x=>x.trade==='월세').length;
    ['q','cat','trade'].forEach(id=>document.getElementById(id).addEventListener('input',render));
    render();
  }catch(e){document.getElementById('err').textContent='비밀번호가 다르거나 데이터를 못 읽었습니다.';}
};
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
</script></body></html>
